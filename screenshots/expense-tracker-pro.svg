    <text class="rowAmount red" x="748" y="1371">- Rs. 3,250.00</text>
    <text class="rowTitle" x="180" y="1426">Monthly salary</text><text class="rowMeta" x="180" y="1444">Salary · Added 01 Oct 2026, 09:00 am</text>
    <text class="rowAmount green" x="748" y="1435">+ Rs. 95,000.00</text>
