  <rect class="card" x="140" y="838" width="920" height="623" rx="12"/>
  <text class="heading" x="164" y="880">Transactions</text>
  <rect x="756" y="855" width="280" height="40" rx="8" fill="#fff" stroke="#d1d5db"/>
  <text class="muted small" x="772" y="880">Search transactions...</text>

