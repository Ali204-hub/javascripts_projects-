<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1530" viewBox="0 0 1200 1530" role="img" aria-labelledby="title desc">
  <title id="title">Expense Tracker Pro dashboard preview</title>
  <desc id="desc">Desktop dashboard preview with income and expense summaries, monthly budget progress, transaction form, search, filters, sorting and sample transactions.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#111827" flood-opacity=".08"/></filter>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#222}
      .muted{fill:#666}.small{font-size:14px}.label{font-size:15px;font-weight:600}
      .card{fill:#fff;filter:url(#shadow)}.heading{font-size:24px;font-weight:700}
      .value{font-size:25px;font-weight:700}.green{fill:#15803d}.red{fill:#dc2626}
      .buttonText{font-size:13px;text-anchor:middle}.rowTitle{font-size:15px;font-weight:700}
      .rowMeta{font-size:12px;fill:#777}.rowAmount{font-size:14px;font-weight:700;text-anchor:end}
    </style>
  </defs>
  <rect width="1200" height="1530" fill="#f4f6f8"/>
  <rect width="1200" height="108" fill="#1f2937"/>
  <text x="130" y="51" font-size="30" font-weight="700" fill="#fff">Expense Tracker</text>
  <text x="130" y="79" font-size="15" fill="#e5e7eb">Manage your income and expenses easily.</text>

  <!-- Summary cards -->
  <g filter="url(#shadow)">
    <rect class="card" x="140" y="132" width="292" height="112" rx="12"/>
    <rect class="card" x="454" y="132" width="292" height="112" rx="12"/>
    <rect class="card" x="768" y="132" width="292" height="112" rx="12"/>
  </g>
  <text class="muted" x="164" y="170" font-size="16" font-weight="700">Total Balance</text>
  <text class="value" x="164" y="211">Rs. 84,550.00</text>
  <text class="muted" x="478" y="170" font-size="16" font-weight="700">Total Income</text>
  <text class="value green" x="478" y="211">Rs. 120,000.00</text>
  <text class="muted" x="792" y="170" font-size="16" font-weight="700">Total Expenses</text>
  <text class="value red" x="792" y="211">Rs. 35,450.00</text>

  <!-- Monthly insights -->
  <rect class="card" x="140" y="266" width="920" height="278" rx="12"/>
  <text class="heading" x="164" y="305">This Month's Spending</text>
  <g>
    <rect x="164" y="326" width="274" height="78" rx="10" fill="#f9fafb" stroke="#e5e7eb"/>
    <rect x="453" y="326" width="274" height="78" rx="10" fill="#f9fafb" stroke="#e5e7eb"/>
    <rect x="742" y="326" width="294" height="78" rx="10" fill="#f9fafb" stroke="#e5e7eb"/>
  </g>
  <text class="muted small" x="181" y="352">Total expenses</text>
  <text x="181" y="380" font-size="17" font-weight="700">Rs. 35,450.00</text>
  <text class="muted small" x="470" y="352">Expense transactions</text>
  <text x="470" y="380" font-size="17" font-weight="700">6</text>
  <text class="muted small" x="759" y="352">Top category</text>
  <text x="759" y="380" font-size="17" font-weight="700">Food — Rs. 12,450.00</text>
  <text class="muted small" x="164" y="428">You recorded 6 expense transaction(s) this month.</text>
  <text class="label muted" x="164" y="461">Monthly budget (PKR)</text>
  <rect x="164" y="475" width="700" height="39" rx="8" fill="#fff" stroke="#d1d5db"/>
  <text x="180" y="500" font-size="15">50000</text>
  <rect x="876" y="475" width="160" height="39" rx="8" fill="#2563eb"/>
  <text x="956" y="500" font-size="14" fill="#fff" text-anchor="middle">Save Budget</text>
