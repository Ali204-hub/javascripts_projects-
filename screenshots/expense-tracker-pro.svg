  <rect x="224" y="910" width="78" height="32" rx="16" fill="#fff" stroke="#ddd"/><text class="buttonText" x="263" y="931">Income</text>
  <rect x="310" y="910" width="91" height="32" rx="16" fill="#fff" stroke="#ddd"/><text class="buttonText" x="355" y="931">Expenses</text>
