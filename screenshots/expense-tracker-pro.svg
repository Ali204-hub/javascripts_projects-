  <rect x="615" y="750" width="421" height="40" rx="8" fill="#fff" stroke="#d1d5db"/>
  <text x="180" y="776" font-size="14">Expense</text><text x="570" y="776" font-size="14">⌄</text>
  <text x="631" y="776" font-size="14">Food</text><text x="1016" y="776" font-size="14">⌄</text>
  <rect x="164" y="804" width="872" height="0" rx="8" fill="#2563eb"/>

