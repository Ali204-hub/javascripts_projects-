<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Expense Tracker Pro</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="header">
        <div>
            <h1>Expense Tracker</h1>
            <p>Manage your income and expenses easily.</p>
        </div>
    </header>

    <main class="container">

        <!-- Summary -->

        <section class="summary">

            <div class="summary-card">
                <h3>Total Balance</h3>
                <p id="balance">Rs. 0.00</p>
            </div>

            <div class="summary-card income">
                <h3>Total Income</h3>
                <p id="income">Rs. 0.00</p>
            </div>

            <div class="summary-card expense">
                <h3>Total Expenses</h3>
                <p id="expense">Rs. 0.00</p>
            </div>

        </section>


        <!-- Add Transaction -->

        <section class="card">

            <h2>Add Transaction</h2>

            <form id="transactionForm">

                <div class="form-group">

                    <label for="title">
                        Description
                    </label>

                    <input
                        type="text"
                        id="title"
                        placeholder="e.g. Grocery shopping"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="amount">
                        Amount
                    </label>

                    <input
                        type="number"
                        id="amount"
                        placeholder="Enter amount"
                        min="1"
                        step="0.01"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="type">
                        Type
                    </label>

                    <select id="type">

                        <option value="expense">
                            Expense
                        </option>

                        <option value="income">
                            Income
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="category">
                        Category
                    </label>

                    <select id="category">

                        <option value="Food">
                            Food
                        </option>

                        <option value="Transport">
                            Transport
                        </option>

                        <option value="Education">
                            Education
                        </option>

                        <option value="Shopping">
                            Shopping
                        </option>

                        <option value="Bills">
                            Bills
                        </option>

                        <option value="Salary">
                            Salary
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>

                </div>


                <button type="submit" class="add-btn">
                    Add Transaction
                </button>

            </form>

        </section>


        <!-- Transactions -->

        <section class="card">

            <div class="transaction-header">

                <h2>Transactions</h2>

                <input
                    type="text"
                    id="search"
                    placeholder="Search transactions..."
                >

            </div>


            <div class="filters">

                <button
                    class="filter-btn active"
                    data-filter="all">
                    All
                </button>

                <button
                    class="filter-btn"
                    data-filter="income">
                    Income
                </button>

                <button
                    class="filter-btn"
                    data-filter="expense">
                    Expenses
                </button>

            </div>


            <ul id="transactionList">
                <!-- Transactions appear here -->
            </ul>

            <p id="emptyMessage" class="empty-message">
                No transactions found.
            </p>

        </section>

    </main>


    <footer>

        <p>
            Expense Tracker Pro |
            Built with HTML, CSS & JavaScript
        </p>

    </footer>


    <script src="script.js"></script>

</body>

</html>
